appId: com.eunilsung.ods
name: 로그인하고 시장 시세를 고객에게 크게 보여 준 뒤 로그아웃
---
- runFlow: ../common/login.yaml
- tapOn:
    id: tab_market
- tapOn:
    id: stock_item
    index: 0
- assertVisible: "차트|Chart"
- tapOn:
    id: presentation_open
- assertVisible:
    id: presentation
- assertVisible: "삼성전자"
- tapOn:
    id: presentation_next
- assertVisible: "SK하이닉스"
- tapOn:
    id: presentation_close
- assertNotVisible:
    id: presentation
- runFlow:
    when:
      visible:
        id: top_back
    commands:
      - tapOn:
          id: top_back
      - waitForAnimationToEnd
- tapOn:
    id: tab_more
- tapOn:
    id: more_logout
- assertVisible:
    id: login_submit
