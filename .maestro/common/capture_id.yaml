appId: com.eunilsung.ods
name: 신분증을 찍는다 — Android 는 기기 카메라 앱으로, iOS 시뮬레이터는 사진첩에서 고른다
---
- tapOn:
    id: opening_capture
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          label: 카메라 앱을 처음 열면 묻는 권한·위치 저장 안내를 넘긴다
          when:
            visible: "While using the app|Allow|Next|NEXT"
          commands:
            - tapOn:
                text: "While using the app|Allow|Next|NEXT"
                optional: true
            - tapOn:
                text: "While using the app|Allow|Next|NEXT"
                optional: true
      - tapOn:
          id: "com.android.camera2:id/shutter_button"
      - tapOn:
          id: "com.android.camera2:id/done_button"
- runFlow:
    label: iOS 시뮬레이터에서는 앱이 사진첩을 연다 — run.sh 가 넣어 둔 신분증 사진(가장 최근 사진)을 고른다
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "(사진|Photo), [^,]+, [^,]+"
          timeout: 10000
      - tapOn:
          text: "(사진|Photo), [^,]+, [^,]+"
          index: 0
- waitForAnimationToEnd
