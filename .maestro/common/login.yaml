appId: com.eunilsung.ods
name: test1 로 로그인하고 앱 잠금 비밀번호(135790)를 정한다
---
- runFlow: launch.yaml
- tapOn:
    id: login_id
- eraseText: 20
- inputText: test1
- tapOn:
    id: login_pw
- inputText: "1234"
- runFlow:
    label: 폰은 키보드가 로그인 버튼을 가린다. 비밀번호 칸의 완료가 곧 로그인이다
    file: dismiss_keyboard.yaml
- tapOn:
    id: login_submit
    optional: true
- extendedWaitUntil:
    notVisible:
      id: login_submit
    timeout: 15000
- assertVisible: "앱 잠금 비밀번호 등록|Set an app passcode"
- runFlow: pin.yaml
- runFlow: pin.yaml
- extendedWaitUntil:
    notVisible:
      id: app_lock_screen
    timeout: 5000
