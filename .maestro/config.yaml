flows:
  - flows/*
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 로그인하고 시장 시세를 고객에게 크게 보여 준 뒤 로그아웃
    - 지금 잠그고 비밀번호로 풀기, 다섯 번 틀리면 데이터를 지우고 로그아웃
    - 고객을 전화번호로 찾아 상담을 기록하고, 신규 고객을 등록
    - 다음 주 방문 일정을 잡고, 방문을 마쳐 상담을 기록
    - 성향 미진단 고객의 투자성향을 진단하고 서명을 받아 저장
    - 국고채를 적합한 고객에게 설명하고 서명을 받아 가입
    - 계좌가 없는 고객에게 신분증 확인·약관·비밀번호·서명으로 종합매매 계좌를 개설
