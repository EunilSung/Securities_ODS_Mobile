# 운영 구성 — PostgreSQL + 서버. 값은 같은 폴더의 .env 에서 읽는다(.env.example 참고).
#
# HTTPS 는 같은 인스턴스의 Talk Caddy 가 맡는다. 80·443 은 Caddy 하나만 쓸 수 있어서다.
# 서버는 공용 네트워크(edge)에 ods-server 라는 이름으로 붙고, Caddy 는 ~/caddy-sites/ods.caddy(deploy.sh 가 만든다)를 읽어 이리로 넘긴다.
# 1GB 인스턴스를 Talk 와 나눠 쓰므로 DB 와 JVM 메모리를 작게 잡았다.
name: ods

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ods
      POSTGRES_USER: ods
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 .env 에 없다}
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=15
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c effective_cache_size=96MB
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ods -d ods"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ods
      DB_USER: ods
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: "4"
    ports:
      - "127.0.0.1:8095:8080"
    networks:
      default:
      edge:
        aliases:
          - ods-server
    logging: *logging

networks:
  edge:
    external: true

volumes:
  db:
